<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Japanese Walking Timer — Treadmill Interval Timer</title>
  <meta name="description" content="Timer interval untuk treadmill Japanese Walking, dengan pemberitahuan suara dan program yang bisa diatur sendiri." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="header-text">
        <div class="eyebrow">TREADMILL · INTERVAL WALK</div>
        <h1>Japanese Walking Timer</h1>
      </div>
      <button class="edit-toggle" id="editToggleBtn" type="button">Atur Program</button>
    </header>

    <!-- ============ RUN VIEW ============ -->
    <div id="viewRun">
      <div class="timeline" id="timeline"></div>

      <div class="dial-card">
        <span class="phase-tag" id="phaseTag">SIAP</span>
        <div class="segment-name" id="segName">Tekan Mulai</div>

        <div class="ring-box">
          <svg viewBox="0 0 240 240">
            <circle class="ring-bg" cx="120" cy="120" r="104"></circle>
            <circle
              class="ring-fg"
              id="ringFg"
              cx="120"
              cy="120"
              r="104"
              stroke-dasharray="653.45"
              stroke-dashoffset="653.45"
            ></circle>
          </svg>
          <div class="ring-center">
            <div class="time-left" id="timeLeft">00:00</div>
            <div class="badge-row">
              <span>SPEED <b id="speedNow">–</b></span>
              <span class="sep">|</span>
              <span>INCLINE <b id="inclineNow">–</b></span>
            </div>
          </div>
        </div>

        <div class="next-up" id="nextUp">Total durasi: 30 menit</div>

        <div class="totals">
          <span>Berlalu <b id="elapsedTotal">00:00</b></span>
          <span>Sisa <b id="remainTotal">30:00</b></span>
        </div>

        <div class="controls">
          <button class="btn-icon active" id="soundBtn" type="button" title="Suara">🔔</button>
          <button class="btn-primary" id="startBtn" type="button">Mulai</button>
          <button class="btn-secondary" id="resetBtn" type="button">Reset</button>
        </div>
        <div class="done-banner" id="doneBanner">Selesai! Kerja bagus 🎉</div>
      </div>

      <div class="list-card">
        <div class="list-title">RENCANA LATIHAN</div>
        <div id="listBody"></div>
      </div>
    </div>

    <!-- ============ EDIT VIEW ============ -->
    <div id="viewEdit">
      <div class="edit-card">
        <div class="list-title">ATUR PROGRAM SENDIRI</div>
        <div id="editBody"></div>
        <button class="add-row-btn" id="addRowBtn" type="button">+ Tambah Tahap</button>
        <div class="edit-summary">
          <span>Jumlah tahap <b id="editCount">0</b></span>
          <span>Total durasi <b id="editTotal">00:00</b></span>
        </div>
        <div class="edit-controls">
          <button class="btn-secondary" id="editDefaultBtn" type="button">Pakai Default</button>
          <button class="btn-primary" id="editSaveBtn" type="button">Simpan &amp; Mulai</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
